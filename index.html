<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR受付システム</title>
</head>

<body>

<h1>QR受付システム</h1>

<button onclick="checkApi()">
API接続確認
</button>

<div id="result"></div>

<script>

const GAS_URL =
'https://script.google.com/macros/s/AKfycbyq6KXridweqjSX-CGQvWmzJngf978qy4E9_laUKPn7qhG6L5DzjSpHBsfpKH_JkwXXYg/exec';

function checkApi(){

  const callbackName =
    'cb_' + Date.now();

  window[callbackName] =
    function(data){

      document.getElementById('result')
        .innerHTML =
        JSON.stringify(data);

    };

  const script =
    document.createElement('script');

  script.src =
    GAS_URL +
    '?action=health' +
    '&callback=' +
    callbackName;

  document.body.appendChild(script);

}

</script>

</body>
</html>
